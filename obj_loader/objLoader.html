<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="icon" href="data:,">
        <title>CS418 Obj Loader MP</title>
        <script src="wrapWebGL2.js"></script>
        <script src="standardCode.js"></script>
        <script src="math.js"></script>
        <script src="objLoader.js"></script>
        <style>
            body {
                margin: 0; border: none; padding: 0;
                display: flex; flex-direction: column;
                width: 100%; height: 100vh;
            }
            .controls {
                flex: 0 0 auto;
            }
            .controls > * { margin: 1em; }
            .display {
                flex-grow: 1;
                line-height: 0rem;
            }
        </style>
    </head>
    <body>
        <form class="controls" action="javascript:void(0);">
            <label>Obj File: <input id="objfile" type="text" /></label>
            <label>Image Path: <input id="texture" type="text" /></label>
            <input id="submit" type="submit" value="Load Obj"/>
        </form>
        <div class="display">
            <canvas width="300" height="300"></canvas>
        </div>
    </body>
</html>
